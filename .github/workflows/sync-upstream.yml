name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 合并上游
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kolbicz/WQFiles.git 2>/dev/null || \
            git remote set-url upstream https://github.com/kolbicz/WQFiles.git
          git fetch --no-tags upstream main
          UPSTREAM=$(git rev-parse upstream/main)
          if git merge-base --is-ancestor "$UPSTREAM" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "已是最新上游。"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$(git show "$UPSTREAM:Info.plist" > /tmp/u.plist && \
            python3 -c 'import plistlib;print(plistlib.load(open("/tmp/u.plist","rb"))["CFBundleShortVersionString"])')" >> "$GITHUB_OUTPUT"

          # 本分支只在几处布局上做了改动，冲突时以上游为准，随后重新应用这些改动。
          if ! git merge --no-edit upstream/main; then
            echo "::warning::与上游冲突，冲突文件以上游为准。"
            git diff --name-only --diff-filter=U | while read -r path; do
              git checkout --theirs -- "$path" 2>/dev/null || true
              git add -- "$path"
            done
          fi

          # 上游是权威来源：非本分支改动的文件全部取上游版本。
          git checkout "$UPSTREAM" -- Info.plist build.sh entitlements.plist source.json \
            README.md README.zh.md RELEASE_NOTES_*.md i18n scripts/zh_apply.py \
            en.lproj zh-Hans.lproj WQLocalization.h WQLocalization.m 2>/dev/null || true
          git rm -r --cached --ignore-unmatch i18n scripts/zh_apply.py >/dev/null 2>&1 || true
          rm -rf i18n scripts/zh_apply.py

          git add -A
          if git diff --cached --quiet; then
            echo "合并后无变化。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync: 同步上游 ${UPSTREAM_VERSION:-最新} 并保留多行分组标题改动"
          fi

      - name: 推送
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: 触发构建
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main --repo "${{ github.repository }}"
