name: Build 汉化版 IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish a rolled-up release IPA'
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run host regression suite
        run: bash tests/run_all_tests.sh

      - name: Build IPA
        env:
          WQ_SKIP_PREFLIGHT: '1'
          WQFILES_FINAL_IPA: ${{ github.workspace }}/dist/WQFiles-zh.ipa
        run: |
          mkdir -p dist
          bash build.sh
          shasum -a 256 dist/WQFiles-zh.ipa | tee dist/WQFiles-zh.ipa.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles-zh-ipa
          path: |
            dist/WQFiles-zh.ipa
            dist/WQFiles-zh.ipa.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          SHA=$(cut -d' ' -f1 dist/WQFiles-zh.ipa.sha256)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="zh-${VERSION}-${BUILD}"
          fi
          NOTES=$(cat <<EOF
          汉化版 WQ Files ${VERSION}（build ${BUILD}），基于上游 kolbicz/WQFiles 自动构建。

          > 需要 iOS 26.0 – 26.7.2 或 iOS 27。签名工具必须保留 App Group 权限（若日志显示 "No App Group"，请换一个会保留 App Group 的签名工具）。

          SHA-256: \`${SHA}\`
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/WQFiles-zh.ipa dist/WQFiles-zh.ipa.sha256 --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/WQFiles-zh.ipa dist/WQFiles-zh.ipa.sha256 \
              --title "WQ Files ${VERSION} 汉化版" --notes "$NOTES" --prerelease
          fi
