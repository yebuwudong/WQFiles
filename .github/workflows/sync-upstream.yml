name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 合并上游并重跑汉化
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kolbicz/WQFiles.git 2>/dev/null || \
            git remote set-url upstream https://github.com/kolbicz/WQFiles.git
          git fetch --no-tags upstream main
          UPSTREAM=$(git rev-parse upstream/main)
          if git merge-base --is-ancestor "$UPSTREAM" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "已是最新上游。"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          UPSTREAM_VERSION=$(git show "$UPSTREAM:Info.plist" > /tmp/upstream-Info.plist
            python3 -c 'import plistlib;print(plistlib.load(open("/tmp/upstream-Info.plist","rb"))["CFBundleShortVersionString"])')
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

          # 汉化改动必然和上游的英文原文冲突，所以冲突一律以上游为准，
          # 再重跑一遍汉化脚本把译文套回去。
          if ! git merge --no-edit "upstream/main"; then
            echo "::warning::与上游冲突，冲突文件以上游为准，随后重跑汉化。"
            git diff --name-only --diff-filter=U | while read -r path; do
              git checkout --theirs -- "$path" 2>/dev/null || true
              git add -- "$path"
            done
          fi

          # 上游代码是权威来源：把不是汉化产物的文件保持上游版本
          git checkout "$UPSTREAM" -- Info.plist entitlements.plist build.sh source.json \
            README.md RELEASE_NOTES_*.md icons tests scripts/update_source.py 2>/dev/null || true

          python3 - <<'PY'
          import plistlib
          path = "Info.plist"
          with open(path, "rb") as handle:
              info = plistlib.load(handle)
          info["CFBundleDisplayName"] = "WQ 文件"
          with open(path, "wb") as handle:
              plistlib.dump(info, handle)
          PY

          python3 scripts/zh_apply.py

          if ! python3 scripts/zh_apply.py --check; then
            echo "::warning::上游新增了未汉化的界面字符串；IPA 仍会构建，但覆盖率检查会失败。"
          fi

          # 上游测试里断言的是英文原文，需要同步成译文
          python3 - <<'PY'
          import re
          from pathlib import Path

          table = {}
          for line in Path("i18n/zh.txt").read_text(encoding="utf-8").splitlines():
              if "\t" in line:
                  key, value = line.split("\t", 1)
                  table[key] = value

          test = Path("tests/browser_ui_regressions.py")
          source = test.read_text(encoding="utf-8")
          patched = re.sub(r'@\\"((?:[^"\\\\]|\\\\.)*)\\"',
                           lambda m: '@\\"' + table.get(m.group(1), m.group(1)) + '\\"', source)
          for english, needle in {
              "Only regular files can be viewed.": "只能查看普通文件。",
              "Only regular files can be shared.": "只能分享普通文件。",
              "Share in progress": "正在分享",
              "Close running apps first.": "请先关闭正在运行的 App。",
          }.items():
              patched = patched.replace(f'"{english}"', f'"{needle}"')
          if patched != source:
              test.write_text(patched, encoding="utf-8")

          # Backups 这类磁盘目录名必须保持英文（脚本已忽略，这里再兜底一次）
          main = Path("main.m")
          text = main.read_text(encoding="utf-8")
          text = text.replace('isEqualToString:@"备份"', 'isEqualToString:@"Backups"')
          main.write_text(text, encoding="utf-8")
          PY

          git add -A
          if git diff --cached --quiet; then
            echo "合并后无变化。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync: 同步上游 ${UPSTREAM_VERSION} 并重跑汉化"
          fi

      - name: 推送
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: 触发汉化版构建
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
