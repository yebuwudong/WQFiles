name: Build 汉化版 IPA

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['source.json', '*.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 检查汉化覆盖率
        run: |
          chmod +x scripts/zh_apply.py
          python3 scripts/zh_apply.py --check || {
            echo "::error::上游新增了未汉化的界面字符串，请补进 i18n/zh.txt 后重新运行 scripts/zh_apply.py";
            exit 1;
          }

      - name: Run host regression suite
        run: bash tests/run_all_tests.sh

      - name: Build IPA
        env:
          WQ_SKIP_PREFLIGHT: '1'
          WQFILES_FINAL_IPA: ${{ github.workspace }}/dist/WQFiles-zh.ipa
        run: |
          mkdir -p dist
          bash build.sh
          shasum -a 256 dist/WQFiles-zh.ipa | tee dist/WQFiles-zh.ipa.sha256
          python3 scripts/zh_source.py dist/WQFiles-zh.ipa
          git --no-pager diff --stat source.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles-zh-ipa
          path: |
            dist/WQFiles-zh.ipa
            dist/WQFiles-zh.ipa.sha256
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          SHA=$(cut -d' ' -f1 dist/WQFiles-zh.ipa.sha256)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="WQ 文件 ${VERSION} 汉化版"
          else
            TAG="zh-latest"
            TITLE="WQ 文件 汉化版（最新构建 ${VERSION} / ${BUILD}）"
          fi
          NOTES=$(cat <<EOF
          汉化版 WQ 文件 ${VERSION}（build ${BUILD}），由 GitHub Actions 基于上游 kolbicz/WQFiles 构建。

          - 汉化：界面文案、警告与日志以外的全部提示
          - 未汉化：内部日志、备份清单键、系统 App 名称表保持英文/原样

          > 需要 iOS 26.0 – 26.7.2 或 iOS 27。签名工具必须保留 App Group 权限（若日志显示 "No App Group"，请换一个会保留 App Group 的签名工具）。

          SHA-256: \`${SHA}\`
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/WQFiles-zh.ipa dist/WQFiles-zh.ipa.sha256 --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" dist/WQFiles-zh.ipa dist/WQFiles-zh.ipa.sha256 \
              --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          # AltStore 源的下载地址固定指向发布标签，所以标签确定后再生成并提交
          WQ_TAG="$TAG" python3 scripts/zh_source.py dist/WQFiles-zh.ipa "汉化版 ${VERSION}（build ${BUILD}）。"
          if ! git diff --quiet source.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source.json
            git commit -m "chore: source.json -> 汉化版 ${VERSION} (${BUILD})"
            git push origin HEAD:main
          fi
